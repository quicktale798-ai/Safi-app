<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A38"/>
      <stop offset="1" stop-color="#0C131D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D6952F"/>
      <stop offset="1" stop-color="#F4C25E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4C25E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4C25E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3"/>

  <!-- faint chart gridlines -->
  <g stroke="#F4C25E" stroke-opacity="0.06" stroke-width="3" stroke-linecap="round">
    <line x1="104" y1="186" x2="408" y2="186"/>
    <line x1="104" y1="266" x2="408" y2="266"/>
    <line x1="104" y1="346" x2="408" y2="346"/>
  </g>

  <!-- rising net-profit trend -->
  <polyline points="128,352 212,296 280,324 384,172"
    fill="none" stroke="url(#gold)" stroke-width="42"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- terminal dot (the brand dot) -->
  <circle cx="384" cy="172" r="80" fill="url(#glow)"/>
  <circle cx="384" cy="172" r="34" fill="#F4C25E"/>
</svg>
